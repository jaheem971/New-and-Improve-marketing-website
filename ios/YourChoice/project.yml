# Fallback for XcodeGen users (`brew install xcodegen && xcodegen generate`).
# The checked-in YourChoice.xcodeproj already works with Xcode 16+; this file
# regenerates an equivalent project if you prefer a generated one.
name: YourChoice
options:
  bundleIdPrefix: com.yourchoice
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  YourChoice:
    type: application
    platform: iOS
    sources:
      - path: YourChoice
    info:
      path: YourChoice/Info.generated.plist
      properties:
        CFBundleDisplayName: YourChoice
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: YourChoice uses your location to rank nearby places by walking time and current conditions.
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
